services:
  db:
    image: mariadb:10.11
    container_name: recepcao_db
    environment:
      MARIADB_USER: ${DATABASE_USER}
      MARIADB_PASSWORD: ${DATABASE_KEY}
      MARIADB_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-recepcao-root-password}
      MARIADB_DATABASE: ${DATABASE_NAME}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u${DATABASE_USER} -p${DATABASE_KEY} || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: recepcao_api
    build:
      context: ./api-recepcao
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV}
      APPLICATION_PORT: ${APPLICATION_PORT}
      APPLICATION_CORS_ORIGIN: ${APPLICATION_CORS_ORIGIN}
      APPLICATION_SWAGGER_URL: ${APPLICATION_SWAGGER_URL}
      SECRET_KEY_JWT: ${SECRET_KEY_JWT}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_KEY: ${DATABASE_KEY}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_URL: ${DATABASE_URL}
      SECRET_EMAIL: ${SECRET_EMAIL}
      SECRET_PASSWORD: ${SECRET_PASSWORD}
      SEED_ADMIN_FIRST_NAME: ${SEED_ADMIN_FIRST_NAME:-Admin}
      SEED_ADMIN_LAST_NAME: ${SEED_ADMIN_LAST_NAME:-Sistema}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin.sistema}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_CPF: ${SEED_ADMIN_CPF:-529.982.247-25}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: recepcao_frontend
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    ports:
      - "81:80"
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV}

volumes:
  db_data:
